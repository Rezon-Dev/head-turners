
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171b2c"/>
      <stop offset="100%" stop-color="#252c42"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9bc5"/>
      <stop offset="100%" stop-color="#ed5c9b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9bd7ff"/>
      <stop offset="100%" stop-color="#5598ed"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- Decorative rings -->
  <circle cx="256" cy="256" r="205" fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="2"/>
  <circle cx="256" cy="256" r="183" fill="none" stroke="#ed72a7" stroke-opacity=".4" stroke-width="2"/>

  <!-- Accent sparkle -->
  <path d="M385 104 L396 137 L429 148 L396 159 L385 192 L374 159 L341 148 L374 137Z" fill="url(#accent)"/>

  <!-- H monogram -->
  <path d="M112 166 V346 M112 256 H253 M253 166 V346"
        fill="none" stroke="#ffffff" stroke-width="29"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- T monogram -->
  <path d="M275 166 H405 M340 166 V346"
        fill="none" stroke="url(#accent)" stroke-width="29"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Blue accent -->
  <path d="M112 386 H400" stroke="url(#blue)" stroke-width="8" stroke-linecap="round"/>

  <!-- Small sparkle -->
  <path d="M415 335 L422 355 L442 362 L422 369 L415 389 L408 369 L388 362 L408 355Z" fill="url(#blue)"/>
</svg>
